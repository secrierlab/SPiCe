[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-spatial"
version = "0.1.1"
description = "Spatial Plasticity in Cellular Environments — GNN-based modelling of cell state plasticity from spatial transcriptomics"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Eloise Withnell" },
    { name = "Cenk Celik" },
    { name = "Maria Secrier", email = "m.secrier@ucl.ac.uk" },
]
keywords = [
    "spatial-transcriptomics",
    "graph-neural-networks",
    "cell-plasticity",
    "epithelial-mesenchymal-transition",
    "cancer-biology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "anndata>=0.10",
    "scanpy>=1.9",
    "networkx>=3.1",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "captum>=0.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
spatial-regression = [
    "geopandas",
    "pysal",
    "mgwr",
    "esda",
    "libpysal",
]
tuning = [
    "optuna>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "pre-commit",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "nbsphinx",
]

[project.urls]
Homepage = "https://github.com/secrierlab/SPiCe"
Documentation = "https://github.com/secrierlab/SPiCe"
Repository = "https://github.com/secrierlab/SPiCe"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
